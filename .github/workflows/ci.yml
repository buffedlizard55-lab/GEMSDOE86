name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-lock.txt
      - name: unit tests (bridge rasters tracked; feature stack not needed)
        run: python -m pytest -q
      - name: static site integrity (read-only)
        run: |
          python scripts/build_review_card.py --check
          python scripts/check_hypothesis_bands.py
          python scripts/verify_focus9_downloads.py
          python scripts/build_site.py --check
          python scripts/check_site.py
          python scripts/audit_downloads.py
          git diff --exit-code docs/
