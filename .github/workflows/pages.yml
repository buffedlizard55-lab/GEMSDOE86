name: Deploy audited research dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Restore only pinned proof inputs, not a model or historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_protocol_data.py --include-registry
      - name: Recheck every inherited TIFF, ZIP, receipt and final-dot stop
        run: python scripts/audit_release.py --measure-registry
      - name: Refresh named-project Git metadata (partial failures stay explicit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_fleet.py --allow-partial
      - name: Build an evidence-only, fail-closed website
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check
          python scripts/check_site.py
          python scripts/audit_downloads.py
          python -m pytest -q
      - name: Retain audit evidence, including explicit failed refreshes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-audit-not-a-submission
          path: |
            docs/evidence/release-readiness.json
            docs/evidence/all-artifacts-registry.json
            docs/evidence/session-20261023-run-card.json
            docs/evidence/latest-review-run-card.json
            docs/evidence/fleet-feed.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
