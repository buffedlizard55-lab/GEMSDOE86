name: Verify audit and shared tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - run: python scripts/audit_downloads.py
      - run: python scripts/audit.py
      - run: python scripts/validate_download.py
      - run: python -m compileall -q scripts src vendor tests
      - run: git diff --exit-code -- docs/evidence
  reproduce-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - name: Restore immutable mirrored inputs and historical witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python scripts/restore_protocol_data.py --include-registry 2>restore-error.log; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done <restore-error.log
            exit 1
          fi
      - name: Recompute negative preflight without changing any thresholds
        run: |
          if ! (python scripts/session_preflight.py && python scripts/check_registry_candidate.py) >proof-output.log 2>&1; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <proof-output.log
            exit 1
          fi
      - name: Require reproducible evidence (only last-bit rho tolerance)
        run: |
          if ! git diff --exit-code -- docs/evidence ':!docs/evidence/inherited-registry-check.json' >proof-diff.log; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <proof-diff.log
            exit 1
          fi
          python scripts/check_registry_reproduction.py
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-proof-not-a-submission
          path: docs/evidence/*.json
