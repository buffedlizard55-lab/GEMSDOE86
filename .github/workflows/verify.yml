name: Verify audit and shared tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - run: python scripts/audit.py
      - run: python scripts/validate_download.py
      - run: python -m compileall -q scripts vendor tests
      - run: git diff --exit-code -- docs/evidence
  reproduce-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore immutable mirrored inputs and historical witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python scripts/restore_data.py --include-registry 2>restore-error.log; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done <restore-error.log
            exit 1
          fi
      - name: Recompute negative preflight without changing any thresholds
        run: |
          python scripts/session_preflight.py
          python scripts/check_registry_candidate.py
      - name: Require byte-reproducible evidence snapshot
        run: git diff --exit-code -- docs/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-proof-not-a-submission
          path: docs/evidence/*.json
