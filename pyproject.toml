[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems86"
version = "0.1.0"
description = "GEMSDOE86 Lane H86-FVMB: iSPI Dip-Projected Contact Dipole, Sibson Hydrothermal Fault-Valve, Asymmetric Wing-Crack SAR-PU & Exact Dinkelbach 300m Submodular DTI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["tests"]
